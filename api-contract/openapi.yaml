openapi: 3.1.0
info:
  title: MoringaLab Commerce API (`فروشگاه سبزینه`)
  description: Official OpenAPI 3.1 REST API contract between Go Backend Monolith and Next.js Storefront/Admin.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Development Local API Server

paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is live

  /health/ready:
    get:
      summary: Readiness probe checking PostgreSQL and storage status
      responses:
        '200':
          description: Service is ready
        '503':
          description: Dependencies not ready

  /storefront/home:
    get:
      summary: Get Storefront homepage layout data
      responses:
        '200':
          description: Homepage hero, featured categories, bestseller products, articles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageDataResponse'

  /catalog/categories:
    get:
      summary: List category hierarchy
      responses:
        '200':
          description: Category tree

  /search:
    get:
      summary: Unified search across products, articles, and categories
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Unified search results

  /catalog/products:
    get:
      summary: Search and filter catalog products
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: category_slug
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [relevance, newest, price_asc, price_desc, bestseller]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Paginated product list

  /catalog/products/{slug}:
    get:
      summary: Get single product details by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed product response
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /auth/otp/request:
    post:
      summary: Request OTP challenge for Iranian mobile number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: "09123456789"
      responses:
        '200':
          description: OTP challenge created and SMS accepted by the configured provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OTPRequestResponse'
        '422':
          description: Invalid Iranian mobile number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '502':
          description: SMS provider did not accept the OTP delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /auth/otp/verify:
    post:
      summary: Verify OTP challenge code and issue session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Session issued
        '401':
          description: OTP is invalid, expired, or has exceeded its attempt limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'

  /carts/current:
    get:
      summary: Get active guest/customer cart
      responses:
        '200':
          description: Cart breakdown

  /checkout/quote:
    post:
      summary: Generate checkout pricing quote and shipping cost calculation
      responses:
        '200':
          description: Itemized pricing quote

  /content/articles:
    get:
      summary: List published articles
      parameters:
        - name: category_slug
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of published articles

  /content/articles/{slug}:
    get:
      summary: Get single published article details by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detailed article response
        '404':
          description: Article not found

  /admin/articles:
    get:
      summary: List all articles for admin management
      responses:
        '200':
          description: All articles including drafts and archived
    post:
      summary: Create new article
      responses:
        '201':
          description: Article created

  /admin/articles/{id}:
    get:
      summary: Get article by ID for editing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Article details
    patch:
      summary: Update article details
      responses:
        '200':
          description: Article updated

  /admin/articles/{id}/publish:
    post:
      summary: Publish article
      responses:
        '200':
          description: Article published

  /admin/orders:
    get:
      summary: List all orders with filters
      responses:
        '200':
          description: Paginated order list
    post:
      summary: Create new order directly by store operator/admin
      responses:
        '201':
          description: Order created successfully

  /admin/orders/stats/summary:
    get:
      summary: Real-time orders summary statistics for mobile app and dashboard
      responses:
        '200':
          description: Orders statistics counters and today's sales

  /admin/orders/notifications/poll:
    get:
      summary: Poll for newly created or updated orders since a given timestamp or ID
      responses:
        '200':
          description: List of new orders with summary stats

  /admin/orders/notifications/stream:
    get:
      summary: Server-Sent Events stream for instantaneous real-time push notifications of store orders
      responses:
        '200':
          description: SSE stream of order events

  /admin/customers:
    get:
      summary: List customers and order metrics
      responses:
        '200':
          description: Customer directory with order metrics

  /admin/access:
    get:
      summary: List all administrators with roles and permissions linked to PostgreSQL users table
      responses:
        '200':
          description: List of admins
    post:
      summary: Create new admin or promote existing user to admin
      responses:
        '200':
          description: Admin created/promoted successfully
    patch:
      summary: Update admin user details, roles, and allowed sections
      responses:
        '200':
          description: Admin updated successfully
    delete:
      summary: Revoke admin role from user
      responses:
        '200':
          description: Admin role revoked

  /admin/access/search-users:
    get:
      summary: Search existing registered users to promote to admin
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Matching users list

  /admin/access/change-password:
    post:
      summary: Change or reset admin password in credentials store
      responses:
        '200':
          description: Password updated successfully

  /shipping/quotes:
    post:
      summary: Calculate dynamic shipping quotes based on province, city, parcel weight and volumetric dimensions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateQuotesRequest'
      responses:
        '200':
          description: Available shipping options for destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingQuotesResponse'

  /admin/shipping/tariffs:
    get:
      summary: Get active Iran Post and Courier tariff settings
      responses:
        '200':
          description: Active shipping tariffs
    put:
      summary: Update shipping tariff parameters and pricing rules
      responses:
        '200':
          description: Tariffs updated successfully

  /admin/shipping/tariffs/sync:
    post:
      summary: Trigger online API sync to fetch latest postal tariffs
      responses:
        '200':
          description: Sync completed

  /orders:
    post:
      summary: Place order and reserve stock transactionally with shipping method selection
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Order created successfully


components:
  schemas:
    HomepageDataResponse:
      type: object
      properties:
        featured_categories:
          type: array
          items:
            type: object
        bestsellers:
          type: array
          items:
            type: object
    OTPRequestResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
        dev_otp:
          type: string
          description: Present only outside the production environment.

    AuthErrorResponse:
      type: object
      required: [code, detail]
      properties:
        code:
          type: string
        detail:
          type: string
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          example: "https://example.local/problems/validation-error"
        title:
          type: string
          example: "اطلاعات واردشده معتبر نیست"
        status:
          type: integer
          example: 422
        code:
          type: string
          example: "VALIDATION_ERROR"
        detail:
          type: string
          example: "یک یا چند فیلد را اصلاح کنید."
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string

    CalculateQuotesRequest:
      type: object
      required: [province, city]
      properties:
        province:
          type: string
          example: "اصفهان"
        city:
          type: string
          example: "اصفهان"
        subtotal_irr:
          type: integer
          format: int64
          example: 10000000
        items:
          type: array
          items:
            type: object
            properties:
              weight_grams:
                type: integer
                example: 250
              length_cm:
                type: integer
                example: 12
              width_cm:
                type: integer
                example: 8
              height_cm:
                type: integer
                example: 5
              quantity:
                type: integer
                example: 2

    ShippingQuotesResponse:
      type: object
      properties:
        province:
          type: string
        city:
          type: string
        quotes:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                example: "post_pishtaz"
              name_fa:
                type: string
                example: "پست پیشتاز سراسری"
              carrier:
                type: string
                example: "post"
              fee_irr:
                type: integer
                format: int64
                example: 420000
              eta_min_days:
                type: integer
              eta_max_days:
                type: integer
              is_free:
                type: boolean
              description:
                type: string
              charged_weight_grams:
                type: integer
              volumetric_weight_grams:
                type: integer
              actual_weight_grams:
                type: integer
