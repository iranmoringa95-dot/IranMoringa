<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" fill="none" className="w-full h-auto">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="hIconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026251" />
      <stop offset="100%" stop-color="#01382e" />
    </linearGradient>

    <!-- Lime Leaf Gradient -->
    <linearGradient id="hLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e3f24a" />
      <stop offset="100%" stop-color="#b4c925" />
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="hEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Terminal Gold Leaf Glow -->
    <linearGradient id="hTerminalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d0de41" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="hLogoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Right Side: Moringa Leaf Icon Badge (RTL layout) -->
  <g transform="translate(330, 10)">
    <!-- Shield Badge -->
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#hIconBgGrad)" stroke="#d0de41" stroke-width="2.5" stroke-opacity="0.5" filter="url(#hLogoShadow)" />
    
    <!-- Background Halo -->
    <circle cx="50" cy="50" r="32" fill="#d0de41" fill-opacity="0.08" />

    <!-- Leaf Arch -->
    <path d="M 50 14 C 27 26 21 51 31 73 C 36 83 50 88 50 88 C 50 88 64 83 69 73 C 79 51 73 26 50 14 Z" 
          fill="none" stroke="url(#hLimeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stem -->
    <path d="M 50 83 C 50 69 50 36 50 20" stroke="url(#hLimeGrad)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Leaflet Pair 1 -->
    <path d="M 50 71 C 41 74 34 68 36 63 C 38 58 47 63 50 66" fill="url(#hLimeGrad)" />
    <path d="M 50 71 C 59 74 66 68 64 63 C 62 58 53 63 50 66" fill="url(#hEmeraldGrad)" />

    <!-- Leaflet Pair 2 -->
    <path d="M 50 59 C 38 61 32 54 35 48 C 38 43 47 49 50 53" fill="url(#hEmeraldGrad)" />
    <path d="M 50 59 C 62 61 68 54 65 48 C 62 43 53 49 50 53" fill="url(#hLimeGrad)" />

    <!-- Leaflet Pair 3 -->
    <path d="M 50 47 C 40 47 35 40 39 35 C 43 31 49 37 50 41" fill="url(#hLimeGrad)" />
    <path d="M 50 47 C 60 47 65 40 61 35 C 57 31 51 37 50 41" fill="url(#hEmeraldGrad)" />

    <!-- Leaflet Pair 4 -->
    <path d="M 50 36 C 43 34 40 28 43.5 24.5 C 46.5 21.5 49.5 27 50 30" fill="url(#hEmeraldGrad)" />
    <path d="M 50 36 C 57 34 60 28 56.5 24.5 C 53.5 21.5 50.5 27 50 30" fill="url(#hLimeGrad)" />

    <!-- Terminal Leaf -->
    <path d="M 50 17 C 47 21 48 27 50 28.5 C 52 27 53 21 50 17 Z" fill="url(#hTerminalGlow)" />
    <circle cx="50" cy="83" r="2.2" fill="url(#hTerminalGlow)" />
  </g>

  <!-- Left/Center: Persian Typography Text -->
  <g transform="translate(315, 62)">
    <!-- Main Persian Wordmark "ایران مورینگا" -->
    <text x="0" y="0" text-anchor="end" font-family="Vazirmatn, system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      ایران <tspan fill="#d0de41">مورینگا</tspan>
    </text>

    <!-- Botanical Sprout Element over Wordmark -->
    <path d="M -30 -38 C -22 -44 -16 -40 -18 -32 C -20 -26 -28 -28 -30 -30 Z" fill="#d0de41" />
    <path d="M -28 -28 C -34 -24 -38 -28 -36 -34 C -34 -38 -28 -34 -28 -30 Z" fill="#34d399" />
  </g>

  <!-- Bilingual Subtitle / Tagline -->
  <g transform="translate(315, 94)">
    <text x="0" y="0" text-anchor="end" font-family="Vazirmatn, system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#ecfdf5" letter-spacing="0">
      سوپرفود ارگانیک و سلامت‌محور
    </text>
    <text x="-215" y="0" text-anchor="end" font-family="ui-monospace, monospace" font-weight="800" font-size="12" fill="#d0de41" letter-spacing="2">
      SUPERFOODS
    </text>
  </g>
</svg>
