<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" className="w-full h-full">
  <defs>
    <!-- Background / Seal Gradient -->
    <linearGradient id="moringaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026251" />
      <stop offset="100%" stop-color="#01382e" />
    </linearGradient>

    <!-- Leaf Vibrant Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9e846" />
      <stop offset="100%" stop-color="#b0c422" />
    </linearGradient>

    <!-- Leaf Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sun Glow / Gold Drop -->
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#d0de41" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="moringaShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Superfood Shield / Circle with Organic Curve -->
  <rect x="8" y="8" width="184" height="184" rx="48" fill="url(#moringaBgGrad)" filter="url(#moringaShadow)" stroke="#d0de41" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Subtle Background Vitality Halo -->
  <circle cx="100" cy="95" r="58" fill="#d0de41" fill-opacity="0.07" />
  <circle cx="100" cy="95" r="42" fill="#d0de41" fill-opacity="0.08" />

  <!-- Outer Leaf Enclosure Arch (Kuli Kuli style botanical frame) -->
  <path d="M 100 24 C 55 48 44 98 62 142 C 72 162 100 172 100 172 C 100 172 128 162 138 142 C 156 98 145 48 100 24 Z" 
        fill="none" stroke="url(#limeGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Botanical Stem -->
  <path d="M 100 162 C 100 135 100 70 100 38" 
        stroke="url(#limeGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Leaflet Pair 1 (Bottom) -->
  <!-- Left Bottom Leaf -->
  <path d="M 100 138 C 82 144 68 132 72 122 C 76 112 94 122 100 128" 
        fill="url(#limeGrad)" stroke="#01382e" stroke-width="1" />
  <!-- Right Bottom Leaf -->
  <path d="M 100 138 C 118 144 132 132 128 122 C 124 112 106 122 100 128" 
        fill="url(#emeraldGrad)" stroke="#01382e" stroke-width="1" />

  <!-- Leaflet Pair 2 (Middle-Lower) -->
  <!-- Left Mid-Low Leaf -->
  <path d="M 100 114 C 76 118 64 104 70 92 C 76 82 94 94 100 102" 
        fill="url(#emeraldGrad)" stroke="#01382e" stroke-width="1" />
  <!-- Right Mid-Low Leaf -->
  <path d="M 100 114 C 124 118 136 104 130 92 C 124 82 106 94 100 102" 
        fill="url(#limeGrad)" stroke="#01382e" stroke-width="1" />

  <!-- Leaflet Pair 3 (Middle-Upper) -->
  <!-- Left Mid-Up Leaf -->
  <path d="M 100 90 C 80 90 70 76 78 66 C 86 58 98 70 100 78" 
        fill="url(#limeGrad)" stroke="#01382e" stroke-width="1" />
  <!-- Right Mid-Up Leaf -->
  <path d="M 100 90 C 120 90 130 76 122 66 C 114 58 102 70 100 78" 
        fill="url(#emeraldGrad)" stroke="#01382e" stroke-width="1" />

  <!-- Leaflet Pair 4 (Top) -->
  <!-- Left Top Leaf -->
  <path d="M 100 68 C 86 64 80 52 87 45 C 93 39 99 50 100 56" 
        fill="url(#emeraldGrad)" />
  <!-- Right Top Leaf -->
  <path d="M 100 68 C 114 64 120 52 113 45 C 107 39 101 50 100 56" 
        fill="url(#limeGrad)" />

  <!-- Terminal Top Center Leaflet -->
  <path d="M 100 32 C 94 40 96 52 100 55 C 104 52 106 40 100 32 Z" 
        fill="url(#goldGlow)" />

  <!-- Bottom Seed / Vitality Droplet -->
  <circle cx="100" cy="162" r="4.5" fill="url(#limeGrad)" />
</svg>
