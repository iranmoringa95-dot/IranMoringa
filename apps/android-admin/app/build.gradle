plugins {
    id "com.android.application"
}

android {
    namespace "ir.moringano.admin"
    compileSdk 35

    defaultConfig {
        applicationId "ir.moringano.admin"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "DEFAULT_API_URL", '"https://moringano.ir/api/v1"'
        testInstrumentationRunner "android.app.InstrumentationTestRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation files("libs/junit-4.13.2.jar", "libs/hamcrest-core-1.3.jar")
}
