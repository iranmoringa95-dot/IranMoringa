version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moringalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-moringalab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moringalab_dev_pass}
      POSTGRES_DB: ${DB_NAME:-moringalab_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-moringalab} -d ${DB_NAME:-moringalab_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-07T00-43-48Z
    container_name: moringalab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minio_admin_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: moringalab-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
